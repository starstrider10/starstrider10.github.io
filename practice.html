<!doctype html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice | Story of Leo</title>
    <!-- Tailwind browser script -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        @import "tailwindcss";

        @theme {
            --color-offblack: #121212;
            --color-offwhite: #F9F9FB;
            --color-mutedslate: #6E727A;
            --font-serif: "Playfair Display", Georgia, serif;
            --font-sans: "Inter", "DM Sans", sans-serif;
        }
        /* Custom dark theme specifically for practice mode to make photos pop */
        body {
            background-color: #0A0A0A;
            color: #F9F9FB;
        }
        .timer-danger {
            color: #EF4444; /* Tailwind red-500 */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-[#F9F9FB] selection:text-[#0A0A0A]">

    <!-- Minimal Header -->
    <header class="p-6 flex justify-between items-center opacity-50 hover:opacity-100 transition-opacity">
        <a href="index.html" class="text-xs uppercase tracking-[0.3em] font-medium text-[#F9F9FB] hover:text-[#6E727A] transition-colors">
            &larr; Back to Site
        </a>
        <div class="text-xs uppercase tracking-[0.3em] text-[#6E727A]">
            Storytelling Practice
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center p-6 w-full max-w-5xl mx-auto">
        
        <!-- Setup State: Select Folder -->
        <div id="setup-view" class="flex flex-col items-center justify-center w-full h-full text-center space-y-12">
            
            <!-- Branding -->
            <div class="space-y-6 flex flex-col items-center">
                <h1 class="text-3xl md:text-5xl font-light tracking-[0.3em] uppercase">Storyteller's Forge</h1>
                
                <a href="https://instagram.com/leo.inframe" target="_blank" class="inline-flex items-center gap-3 text-[#F9F9FB] hover:text-[#0A0A0A] hover:bg-[#F9F9FB] transition-all text-xs font-mono tracking-widest uppercase border border-[#F9F9FB]/30 px-5 py-2.5 rounded-full">
                    <span>made by</span>
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                      <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                      <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                    <span>@leo.inframe</span>
                </a>
                
                <p class="text-[#6E727A] text-xs md:text-sm tracking-[0.2em] uppercase max-w-lg mt-4 leading-relaxed">
                    like a blade, your storytelling must be honed. i am serious
                </p>
            </div>
            
            <!-- Folder Selection -->
            <div class="pt-8">
                <label for="folder-input" class="cursor-pointer border border-[#F9F9FB]/30 px-8 py-4 text-xs md:text-sm uppercase tracking-[0.2em] hover:bg-[#F9F9FB] hover:text-[#0A0A0A] transition-colors">
                    Load Practice Folder
                </label>
                <input type="file" id="folder-input" webkitdirectory directory multiple class="hidden" accept="image/*">
            </div>

        </div>

        <!-- Practice State: Photo & Timer -->
        <div id="practice-view" class="hidden flex-col items-center justify-center w-full h-full space-y-8">
            
            <!-- Timer Display -->
            <div id="timer-display" class="text-4xl md:text-6xl font-light tracking-wider font-mono transition-colors duration-300">
                02:00
            </div>

            <!-- Image Container with Overlay Controls -->
            <div class="relative w-full max-w-4xl h-[50vh] md:h-[60vh] flex flex-col items-center justify-center bg-[#121212] rounded border border-[#6E727A]/20 overflow-hidden shadow-2xl group">
                <img id="photo-display" src="" alt="Practice Photo" class="w-full h-full object-contain opacity-0 transition-opacity duration-500">
                <div id="loading-spinner" class="absolute hidden text-[#6E727A] text-xs uppercase tracking-widest">Loading...</div>
                
                <!-- Bottom Glass Overlay -->
                <div class="absolute bottom-0 w-full bg-[#0A0A0A]/70 backdrop-blur-md border-t border-[#6E727A]/20 p-4 flex justify-center items-center transition-opacity">
                    
                    <!-- Controls -->
                    <div class="flex gap-4">
                        <button id="btn-toggle-timer" class="flex items-center gap-2 border border-[#F9F9FB]/30 bg-[#0A0A0A]/50 px-6 py-3 text-xs uppercase tracking-[0.2em] hover:bg-[#F9F9FB] hover:text-[#0A0A0A] transition-colors rounded-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <circle cx="12" cy="12" r="10" stroke-width="2"/>
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6l4 2"/>
                            </svg>
                            <span id="btn-timer-text">Start Timer</span>
                        </button>
                        <button id="btn-spin" class="flex items-center gap-2 border border-[#F9F9FB]/30 bg-[#0A0A0A]/50 px-6 py-3 text-xs uppercase tracking-[0.2em] hover:bg-[#F9F9FB] hover:text-[#0A0A0A] transition-colors rounded-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                            </svg>
                            Spin Photo
                        </button>
                    </div>
                </div>
            </div>
            
            <div id="status-text" class="text-[#6E727A] text-xs tracking-widest uppercase">
                Photos remaining: <span id="photo-count">0</span>
            </div>
        </div>

    </main>

    <script>
        const folderInput = document.getElementById('folder-input');
        const setupView = document.getElementById('setup-view');
        const practiceView = document.getElementById('practice-view');
        const photoDisplay = document.getElementById('photo-display');
        const btnSpin = document.getElementById('btn-spin');
        const btnToggleTimer = document.getElementById('btn-toggle-timer');
        const timerDisplay = document.getElementById('timer-display');
        const photoCount = document.getElementById('photo-count');
        
        let imageFiles = [];
        let remainingFiles = [];
        let currentObjectUrl = null;
        
        // Timer state
        let timerInterval = null;
        let timeRemaining = 120; // 2 minutes in seconds
        const TOTAL_TIME = 120;

        // 1. Handle Folder Selection
        folderInput.addEventListener('change', (event) => {
            const files = Array.from(event.target.files);
            // Filter only image files
            imageFiles = files.filter(file => file.type.startsWith('image/'));
            
            if (imageFiles.length === 0) {
                alert("No images found in that folder. Please select a folder with images.");
                return;
            }

            remainingFiles = [...imageFiles];
            shuffleArray(remainingFiles);
            
            // Switch views
            setupView.classList.add('hidden');
            practiceView.classList.remove('hidden');
            practiceView.classList.add('flex');
            
            updateStatus();
            drawPhoto();
        });

        // 2. Draw a Random Photo
        btnSpin.addEventListener('click', () => {
            drawPhoto();
        });

        function drawPhoto() {
            if (remainingFiles.length === 0) {
                // Reshuffle if we run out
                remainingFiles = [...imageFiles];
                shuffleArray(remainingFiles);
                alert("You've gone through all photos! Reshuffling the deck.");
            }

            const file = remainingFiles.pop();
            updateStatus();

            // Clean up previous object URL to prevent memory leaks
            if (currentObjectUrl) {
                URL.revokeObjectURL(currentObjectUrl);
            }

            // Create new object URL
            currentObjectUrl = URL.createObjectURL(file);
            
            // UI Transition
            photoDisplay.style.opacity = 0;
            setTimeout(() => {
                photoDisplay.src = currentObjectUrl;
                photoDisplay.onload = () => {
                    photoDisplay.style.opacity = 1;
                };
            }, 300);

            // Reset Timer automatically on new draw
            resetTimer();
        }

        // 3. Timer Logic
        const btnTimerText = document.getElementById('btn-timer-text');
        
        btnToggleTimer.addEventListener('click', () => {
            if (timerInterval) {
                stopTimer();
                btnTimerText.innerText = "Resume Timer";
            } else {
                startTimer();
                btnTimerText.innerText = "Pause Timer";
            }
        });

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                
                if (timeRemaining <= 0) {
                    stopTimer();
                    timerDisplay.innerText = "TIME'S UP";
                    timerDisplay.classList.add('timer-danger');
                } else if (timeRemaining <= 15) {
                    timerDisplay.classList.add('timer-danger');
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer() {
            stopTimer();
            timeRemaining = TOTAL_TIME;
            btnTimerText.innerText = "Start Timer";
            timerDisplay.classList.remove('timer-danger');
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            if (timeRemaining < 0) return;
            const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
            const s = (timeRemaining % 60).toString().padStart(2, '0');
            timerDisplay.innerText = `${m}:${s}`;
        }

        // Helper: Fisher-Yates Shuffle
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function updateStatus() {
            photoCount.innerText = remainingFiles.length;
        }
    </script>
</body>
</html>
