<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Story of Leo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        offblack: '#121212',
                        offwhite: '#F9F9FB',
                        mutedslate: '#6E727A'
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'Georgia', 'serif'],
                        sans: ['Inter', 'DM Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .gallery-image { transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease; }
        .gallery-item:hover .gallery-image { transform: scale(1.05); opacity: 0.9; }
    </style>
</head>
<body class="bg-[#F9F9FB] text-[#121212] selection:bg-[#121212] selection:text-[#F9F9FB]">

    <!-- Navigation Header -->
    <nav class="fixed top-0 w-full z-50 px-6 py-6 flex justify-between items-center bg-[#F9F9FB]/90 border-b border-[#6E727A]/20 backdrop-blur-md">
        <a href="index.html" class="text-sm font-bold tracking-[0.2em] uppercase text-[#121212] font-sans">Story of Leo</a>
        <div class="flex gap-8 text-[10px] md:text-xs uppercase tracking-[0.3em] font-medium items-center font-sans">
            <a href="index.html" class="text-[#121212] hover:text-[#6E727A] transition-colors">Home</a>
            
            <!-- Gallery Dropdown -->
            <div class="relative group">
                <a href="gallery.html" class="text-[#121212] hover:text-[#6E727A] transition-colors">Gallery</a>
                <div class="absolute left-0 mt-2 w-52 bg-[#F9F9FB] border border-[#6E727A]/30 shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 flex flex-col py-2 z-50">
                    <a href="gallery.html?filter=prints" class="px-4 py-2 hover:bg-[#6E727A]/10 text-[#121212] font-bold transition-colors">Fine Art Prints</a>
                    <a href="gallery.html?filter=portraiture" class="px-4 py-2 hover:bg-[#6E727A]/10 text-[#121212] transition-colors">Portraiture</a>
                    <a href="gallery.html?filter=adventure" class="px-4 py-2 hover:bg-[#6E727A]/10 text-[#121212] transition-colors">Adventure (All)</a>
                    <a href="gallery.html?filter=backpacking" class="px-4 py-2 hover:bg-[#6E727A]/10 text-[#121212] transition-colors">Backpacking</a>
                    <a href="gallery.html?filter=outdoors" class="px-4 py-2 hover:bg-[#6E727A]/10 text-[#121212] transition-colors">Outdoors</a>
                    <div class="h-[1px] bg-[#6E727A]/20 my-1 mx-4"></div>
                    <a href="gallery.html?filter=sakura" class="px-4 py-2 hover:bg-[#6E727A]/10 text-[#6E727A] transition-colors">Sakura Series</a>
                </div>
            </div>

            <a href="journal.html" class="text-[#121212] hover:text-[#6E727A] transition-colors">Journal</a>
            <a href="about.html" class="text-[#121212] hover:text-[#6E727A] transition-colors">About</a>
        </div>
    </nav>

    <main class="pt-32 px-6 sm:px-10 lg:px-16 w-full max-w-[2400px] mx-auto">
        
        <!-- Header & Series Filter -->
        <header class="mb-8">
            <h1 class="text-xs uppercase tracking-[0.5em] text-[#6E727A] mb-6 font-bold font-sans">Visual Archives</h1>
            <div class="flex flex-wrap gap-8 md:gap-16 border-b border-[#6E727A]/20 pb-6 items-center">
                <div class="relative group h-full py-2">
                    <button onclick="filterGallery('prints')" class="text-xl md:text-2xl font-serif hover:text-[#6E727A] transition-all tracking-tight filter-btn active text-[#121212] border-b border-[#121212] flex items-center gap-3">
                        Fine Art Prints <span class="text-[8px] opacity-60 translate-y-[1px] group-hover:rotate-180 transition-transform">▼</span>
                    </button>
                    <div class="absolute top-full left-0 mt-0 bg-[#F9F9FB] border border-[#6E727A]/30 py-4 px-6 hidden group-hover:block z-50 min-w-[210px] shadow-xl backdrop-blur-md">
                        <button onclick="filterGallery('prints')" class="block text-[10px] uppercase tracking-[0.3em] font-sans hover:text-[#121212] text-[#121212] font-bold transition-colors py-2 text-left w-full filter-btn">All Print Collections</button>
                        <button onclick="filterGallery('prints:alpine')" class="block text-[10px] uppercase tracking-[0.3em] font-sans hover:text-[#121212] text-[#6E727A] transition-colors py-2 text-left w-full filter-btn">Alpine &amp; Wilderness</button>
                        <button onclick="filterGallery('prints:urban')" class="block text-[10px] uppercase tracking-[0.3em] font-sans hover:text-[#121212] text-[#6E727A] transition-colors py-2 text-left w-full filter-btn">Urban &amp; Skylines</button>
                        <button onclick="filterGallery('prints:wildlife')" class="block text-[10px] uppercase tracking-[0.3em] font-sans hover:text-[#121212] text-[#6E727A] transition-colors py-2 text-left w-full filter-btn">Wildlife &amp; Fine Art</button>
                        <button onclick="filterGallery('prints:travel')" class="block text-[10px] uppercase tracking-[0.3em] font-sans hover:text-[#121212] text-[#6E727A] transition-colors py-2 text-left w-full filter-btn">Travel Story Prints</button>
                    </div>
                </div>

                <div class="relative group h-full py-2">
                    <button onclick="filterGallery('portraiture')" class="text-xl md:text-2xl font-serif hover:text-[#6E727A] transition-all tracking-tight filter-btn text-[#6E727A] flex items-center gap-3">
                        Portraiture <span class="text-[8px] opacity-60 translate-y-[1px] group-hover:rotate-180 transition-transform">▼</span>
                    </button>
                    <div class="absolute top-full left-0 mt-0 bg-[#F9F9FB] border border-[#6E727A]/30 py-4 px-6 hidden group-hover:block z-50 min-w-[180px] shadow-xl backdrop-blur-md">
                        <button onclick="filterGallery('sakura')" class="block text-[10px] uppercase tracking-[0.3em] font-sans hover:text-[#121212] text-[#6E727A] transition-colors py-2 text-left w-full filter-btn">Sakura Series</button>
                        <button onclick="filterGallery('portraiture')" class="block text-[10px] uppercase tracking-[0.3em] font-sans hover:text-[#121212] text-[#6E727A] transition-colors py-2 text-left w-full filter-btn">All Portraits</button>
                    </div>
                </div>

                <div class="relative group h-full py-2">
                    <button onclick="filterGallery('adventure')" class="text-xl md:text-2xl font-serif hover:text-[#6E727A] transition-all tracking-tight filter-btn text-[#6E727A] flex items-center gap-3">
                        Adventure <span class="text-[8px] opacity-60 translate-y-[1px] group-hover:rotate-180 transition-transform">▼</span>
                    </button>
                    <div class="absolute top-full left-0 mt-0 bg-[#F9F9FB] border border-[#6E727A]/30 py-4 px-6 hidden group-hover:block z-50 min-w-[180px] shadow-xl backdrop-blur-md">
                        <button onclick="filterGallery('backpacking')" class="block text-[10px] uppercase tracking-[0.3em] font-sans hover:text-[#121212] text-[#6E727A] transition-colors py-2 text-left w-full filter-btn">Backpacking</button>
                        <button onclick="filterGallery('outdoors')" class="block text-[10px] uppercase tracking-[0.3em] font-sans hover:text-[#121212] text-[#6E727A] transition-colors py-2 text-left w-full filter-btn">Outdoors</button>
                        <button onclick="filterGallery('adventure')" class="block text-[10px] uppercase tracking-[0.3em] font-sans hover:text-[#121212] text-[#6E727A] transition-colors py-2 text-left w-full filter-btn">All Adventure</button>
                    </div>
                </div>

                <button onclick="filterGallery('street')" class="text-xl md:text-2xl font-serif hover:text-[#6E727A] transition-all tracking-tight filter-btn text-[#6E727A]">Street</button>

                <button onclick="filterGallery('all')" class="text-xl md:text-2xl font-serif hover:text-[#6E727A] transition-all tracking-tight filter-btn text-[#6E727A] ml-auto">All Work (Archive)</button>
            </div>
        </header>

        <!-- Hero / Album Preview Section -->
        <div id="gallery-container" class="space-y-12 mb-32">
            <!-- Dynamic Album Sections will be injected here -->
        </div>

        <!-- Album Modal -->
        <div id="album-modal" class="fixed inset-0 z-[100] bg-[#121212]/95 hidden flex flex-col justify-center items-center p-4 transition-opacity duration-500 opacity-0 backdrop-blur-md">
            <button onclick="closeModal()" class="absolute top-8 right-8 text-[#F9F9FB]/40 hover:text-[#F9F9FB] text-5xl font-light transition-colors z-[110]">&times;</button>
            
            <div class="relative w-full max-w-5xl h-[72vh] md:h-[76vh] flex items-center justify-center group">
                <!-- Navigation Arrows -->
                <button onclick="prevPhoto()" class="absolute left-4 z-[120] text-[#F9F9FB]/30 hover:text-[#F9F9FB] text-6xl font-thin transition-all px-4 h-full flex items-center">&lsaquo;</button>
                
                <!-- Standard Fullscreen Image Area -->
                <div id="modal-standard-view" class="w-full h-full flex items-center justify-center relative">
                    <img id="modal-img" src="" class="max-w-full max-h-full object-contain shadow-2xl transition-opacity duration-300">
                </div>

                <!-- Interactive Room Scale Visualizer Canvas -->
                <div id="room-view" class="hidden absolute inset-0 flex flex-col items-center justify-between p-2 md:p-6 bg-[#1A1A1D] rounded-sm border border-white/10 overflow-hidden shadow-2xl transition-all duration-700">
                    <div id="wall-bg" class="relative w-full h-full flex flex-col justify-between items-center bg-[#E5E3DF] rounded-sm transition-colors duration-500 overflow-hidden border border-black/10">
                        <!-- Wall Tone Controls -->
                        <div class="absolute top-3 left-4 z-20 flex items-center gap-2 bg-black/40 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20">
                            <span class="text-[8px] uppercase tracking-widest text-white/90 font-sans font-bold">Wall Tone:</span>
                            <button onclick="setWallTone('#E5E3DF')" class="w-3.5 h-3.5 rounded-full bg-[#E5E3DF] border border-black/30 shadow-sm focus:outline-none hover:scale-110 transition-transform" title="Warm Sand"></button>
                            <button onclick="setWallTone('#F4F4F6')" class="w-3.5 h-3.5 rounded-full bg-[#F4F4F6] border border-black/30 shadow-sm focus:outline-none hover:scale-110 transition-transform" title="Nordic White"></button>
                            <button onclick="setWallTone('#3A3B3E')" class="w-3.5 h-3.5 rounded-full bg-[#3A3B3E] border border-black/30 shadow-sm focus:outline-none hover:scale-110 transition-transform" title="Charcoal Slate"></button>
                        </div>

                        <!-- Scale & Dimension Badge -->
                        <div id="room-scale-badge" class="absolute top-3 right-4 z-20 text-[8px] uppercase tracking-widest bg-black/80 text-white px-3 py-1.5 rounded-full border border-white/20 font-sans font-bold shadow-md">
                            16x24" (40x60cm) — Study &amp; Feature Wall
                        </div>

                        <!-- Mounted Fine Art Gallery Frame -->
                        <div class="relative flex-1 w-full flex items-center justify-center p-4 min-h-[48vh]">
                            <div id="room-framed-print" class="relative transition-all duration-500 shadow-[0_25px_60px_rgba(0,0,0,0.55)] bg-[#121212] p-2 md:p-3 border border-black/90 flex items-center justify-center max-w-[90%] max-h-[85vh]">
                                <!-- White Fine Art Mat -->
                                <div class="bg-[#FDFBF7] p-2 md:p-3 shadow-inner border border-black/10 flex items-center justify-center w-full h-full">
                                    <img id="room-print-img" src="" class="w-full h-full object-contain shadow-sm transition-all duration-300">
                                </div>
                            </div>
                        </div>

                        <!-- Minimalist Living Room Furniture Silhouette -->
                        <div class="w-full flex flex-col items-center z-10 pointer-events-none mb-0">
                            <div class="w-4/5 md:w-3/5 h-10 md:h-14 bg-[#1C1C1E] border-t-2 border-[#3A3A3D] shadow-2xl relative flex items-center justify-between px-8">
                                <!-- Decorative Accent Vase -->
                                <div class="w-3 md:w-4 h-7 md:h-9 bg-gradient-to-t from-[#2C2C2E] to-[#48484A] rounded-t-full -mt-5 opacity-90 shadow-md"></div>
                                <!-- Studio Book Stack -->
                                <div class="w-10 md:w-14 h-2.5 bg-[#4A3B32] border-t border-white/20 -mt-2 shadow-md"></div>
                            </div>
                            <div class="w-3/5 md:w-2/5 flex justify-between px-6">
                                <div class="w-1.5 h-4 bg-[#121212]"></div>
                                <div class="w-1.5 h-4 bg-[#121212]"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <button onclick="nextPhoto()" class="absolute right-4 z-[120] text-[#F9F9FB]/30 hover:text-[#F9F9FB] text-6xl font-thin transition-all px-4 h-full flex items-center">&rsaquo;</button>
            </div>
            
            <div class="mt-4 flex flex-col items-center z-[110] max-w-2xl w-full px-4 text-center">
                <div class="flex items-center gap-4 mb-2">
                    <span id="modal-model-name" class="text-[9px] uppercase tracking-[0.6em] text-[#F9F9FB] font-bold font-sans"></span>
                    <span class="text-[#6E727A]">•</span>
                    <div id="modal-counter" class="text-[8px] uppercase tracking-[0.4em] text-[#6E727A] font-sans"></div>
                </div>
                
                <!-- Shopify POD Preload & Room Scale Controls -->
                <div class="flex flex-col sm:flex-row items-center justify-between gap-3 bg-[#F9F9FB]/10 border border-[#F9F9FB]/20 p-3 rounded-sm backdrop-blur-md w-full">
                    <button id="room-toggle-btn" onclick="toggleRoomView()" class="bg-[#F9F9FB]/20 hover:bg-[#F9F9FB]/30 text-[#F9F9FB] border border-[#F9F9FB]/30 px-3.5 py-1.5 text-[9px] font-bold uppercase tracking-[0.2em] font-sans transition-all duration-300 flex items-center gap-2">
                        🖼️ Preview on Wall
                    </button>

                    <div class="flex items-center gap-2 text-[10px] font-sans uppercase tracking-widest text-[#F9F9FB]">
                        <span class="opacity-60">Print Size:</span>
                        <select id="print-size-select" onchange="updatePrintPrice()" class="bg-[#121212] border border-[#F9F9FB]/30 text-[#F9F9FB] px-2 py-1 text-[10px] font-sans focus:outline-none">
                            <option value="8x12" data-price="85">8x12" - $85</option>
                            <option value="12x18" data-price="125">12x18" - $125</option>
                            <option value="16x24" data-price="180" selected>16x24" - $180</option>
                            <option value="24x36" data-price="290">24x36" - $290</option>
                        </select>
                    </div>

                    <a id="buy-print-btn" href="#" target="_blank" class="bg-[#F9F9FB] text-[#121212] hover:bg-white px-5 py-1.5 text-[10px] font-bold uppercase tracking-[0.2em] font-sans transition-all duration-300 shadow-md">
                        Order Fine Art Print &rarr;
                    </a>
                </div>
            </div>
        </div>

        <!-- Call to Action -->
        <footer class="py-24 text-center border-t border-[#6E727A]/20">
            <h2 class="text-3xl md:text-5xl font-serif font-normal tracking-tight mb-8 italic text-[#121212]">Ready to tell a <span class="italic text-[#6E727A]">new story?</span></h2>
            <a href="mailto:hello@storyofleo.com" class="text-[10px] uppercase tracking-[0.4em] font-bold font-sans text-[#121212] border-b border-[#121212]/30 hover:border-[#121212] transition-all pb-2">
                hello@storyofleo.com
            </a>
        </footer>

    </main>

    <script src="https://sdks.shopifycdn.com/js-buy-sdk/v2/latest/shopify-buy.umd.polyfilled.min.js"></script>
    <script src="gallery-data.js"></script>
    <script src="gallery-logic.js"></script>

</body>
</html>
